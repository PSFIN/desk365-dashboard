name: Track Ticket Activity

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Snapshot and diff ticket state
        env:
          DESK365_API_KEY: ${{ secrets.DESK365_API_KEY }}
        run: python3 scripts/track_activity.py

      - name: Commit changes, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticket_snapshot.json data/activity_log.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Activity log update"
            git push
          fi
