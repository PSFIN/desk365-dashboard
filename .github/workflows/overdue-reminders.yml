name: Send Overdue Ticket Reminders

on:
  # The Mon/Wed/Fri 9am schedule now runs locally via launchd (teams-bot/run_reminders.sh,
  # com.desk365.reminders) — GitHub's cron was firing 4-7 hours late, so the script's 9am-window
  # check skipped every run, and the quick-tunnel URL this workflow posts to kept rotating.
  # Re-enable this (and keep exactly one scheduler active, or people get duplicate reminders):
  #   schedule:
  #     - cron: '0 13,14 * * 1,3,5'
  # Manual runs below still work whenever the tunnel URL secret is current.
  workflow_dispatch:
    inputs:
      test_assignee_email:
        description: 'Only send to this one assignee (for a safe end-to-end test)'
        required: false
        default: ''
      force_reinstall_emails:
        description: 'Comma-separated emails to uninstall+reinstall the bot for (recovers a stuck no_conversation_ref after a webhook-endpoint outage)'
        required: false
        default: ''

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send overdue reminders
        env:
          DESK365_API_KEY: ${{ secrets.DESK365_API_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_APP_ID: ${{ secrets.GRAPH_APP_ID }}
          GRAPH_APP_SECRET: ${{ secrets.GRAPH_APP_SECRET }}
          TEAMS_APP_CATALOG_ID: ${{ secrets.TEAMS_APP_CATALOG_ID }}
          REMINDER_WEBHOOK_URL: ${{ secrets.REMINDER_WEBHOOK_URL }}
          REMINDER_WEBHOOK_SECRET: ${{ secrets.REMINDER_WEBHOOK_SECRET }}
          PILOT_ALLOWLIST: ${{ secrets.PILOT_ALLOWLIST }}
          TEST_ASSIGNEE_EMAIL: ${{ github.event.inputs.test_assignee_email }}
          FORCE_REINSTALL_EMAILS: ${{ github.event.inputs.force_reinstall_emails }}
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python3 scripts/send_overdue_reminders.py
